<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title data-i18n="name">Unity Web翻译机</title></head><body>
<div class="heading"><h1 data-i18n="name">Unity Web翻译机</h1><span id="popupVersion" class="version"></span></div><p id="provider" data-i18n="connecting">连接扩展后台…</p>
<button id="pauseToggle" disabled data-i18n="pauseTranslation" aria-pressed="false">暂停翻译</button>
<section class="site"><h2 data-i18n="pageProfile">当前网页的 Profile</h2><p class="hint scope" id="pageScope"></p><select id="profileSelect" disabled data-i18n-label="pageProfile"></select>
<div class="translation-switches"><label><span data-i18n="storyEnabled">剧情文字翻译</span><input type="checkbox" id="storyEnabled" data-i18n-label="storyEnabled" disabled></label><label><span data-i18n="uiEnabled">界面文字翻译</span><input type="checkbox" id="uiEnabled" data-i18n-label="uiEnabled" disabled></label></div>
<p class="hint" data-i18n="sharedSwitchesHint">文字开关对所有已绑定的 Profile 生效。</p><p class="hint" id="profileHint" data-i18n="profileBindingHint">选择 Profile 即启用此网页，首次使用请确认浏览器授权。</p><p class="hint" id="status" role="status" aria-live="polite" data-i18n="syncHint">网页每三秒同步设置。</p><button id="createProfile" class="secondary" data-i18n="createProfile">新建 Profile</button></section>
<details class="site" id="pageAccess"><summary data-i18n="pageTitle">当前网页</summary><p class="hint" data-i18n="pageHint">选择 Profile 时自动启用勾选的网页及嵌入域名；也可在这里单独启用或停用。</p><div id="origins"></div><button id="siteToggle" disabled data-i18n="enablePage">启用所选网页</button></details>
<section class="site"><h2 data-i18n="nativeStatusTitle">原生文本接入</h2><p class="hint" id="runtimeStatus" role="status" aria-live="polite" data-i18n="nativeWaiting">启用并刷新网页后检查文本接口。</p><button class="secondary" id="runtimeRefresh" data-i18n="nativeRefresh">检查接入</button><details><summary data-i18n="nativePaths">最近资源路径</summary><pre class="hint scope" id="runtimePaths"></pre></details></section>
<button id="settings" class="secondary" data-i18n="settingsTitle">Unity Web翻译机 · 设置</button><button id="update" class="secondary" data-i18n="updateExtension">更新插件</button><script type="module" src="popup.js"></script></body></html>
